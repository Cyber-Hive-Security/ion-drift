name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*'
      - 'drift-v*'
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Publish to the container registry of whichever forge is running this
      # workflow: ghcr.io on GitHub, the forge's own registry (same host)
      # otherwise (Gitea/Forgejo serve theirs on the instance hostname).
      # Non-GitHub forges need repo Actions secrets RELEASE_REGISTRY_USER /
      # RELEASE_REGISTRY_TOKEN (a token with write:package) because the
      # auto-provisioned actions token cannot always push packages.
      - name: Determine target registry
        id: reg
        run: |
          if [ "${{ github.server_url }}" = "https://github.com" ]; then
            echo "registry=ghcr.io" >> "$GITHUB_OUTPUT"
          else
            echo "registry=${GITHUB_SERVER_URL#*://}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.reg.outputs.registry }}
          username: ${{ secrets.RELEASE_REGISTRY_USER || github.actor }}
          password: ${{ secrets.RELEASE_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.reg.outputs.registry }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # drift-vX.Y.Z tag scheme (e.g. drift-v0.5.0)
            type=match,pattern=drift-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=drift-v(\d+\.\d+)\.\d+,group=1
            # letter-suffixed patch tags (e.g. v0.5.2b) — not valid semver,
            # so the type=semver patterns above skip them entirely
            type=match,pattern=v(\d+\.\d+\.\d+[a-z]+),group=1
            type=match,pattern=v(\d+\.\d+)\.\d+[a-z]+,group=1
            # Release tags are never "the default branch", so the old
            # is_default_branch condition meant :latest was never updated.
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bakes the release version into the binary (routes::version() /
          # the /health endpoint). Without it every image reports "dev".
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
