name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*'
      - 'drift-v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # drift-vX.Y.Z tag scheme (e.g. drift-v0.5.0)
            type=match,pattern=drift-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=drift-v(\d+\.\d+)\.\d+,group=1
            # Release tags are never "the default branch", so the old
            # is_default_branch condition meant :latest was never updated.
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bakes the release version into the binary (routes::version() /
          # the /health endpoint). Without it every image reports "dev".
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
