# Ion Drift — Production Configuration (Docker)
#
# Copy this file to config/production.toml and edit for your environment.
# All paths use container paths (/app/...), not host paths.
#
# For local auth (no OIDC), only [server] is required — the setup wizard
# handles everything else on first launch.
#
# For OIDC with encrypted secrets, uncomment the [oidc], [oidc.bootstrap],
# [tls], and [certwarden] sections.

[server]
listen_addr = "0.0.0.0"
# When running in Docker, keep this at 3000. Use Docker port mapping
# (e.g. "3100:3000" in docker-compose.yml) to change the external port.
listen_port = 3000
# Trust X-Forwarded-For / X-Real-IP for client-IP (login rate-limit keys, auth
# logs). Enable ONLY behind a reverse proxy that OVERWRITES these headers.
# Directly exposed? Leave false to prevent per-IP rate-limit spoofing.
trust_proxy_headers = true
# Home location for world map — required for connection arc lines to render.
home_lon = 142.20
home_lat = 11.35
home_country = "US"

[router]
host = "192.168.88.1"
port = 443
tls = true
# Container path — bind-mounted via docker-compose.yml
ca_cert_path = "/app/certs/root_ca.crt"
username = "ion-drift"
wan_interface = "ether1"
# dns_server = "192.168.88.1"
# Source address the router sees ion-drift's own REST requests arriving from.
# Optional; lets brute-force detection tell a stale stored router password apart
# from someone guessing that username. Leaving it unset never suppresses a
# detection. In a container this is the host's address on the router's path.
# Override: DRIFT_ROUTER_LOCAL_SOURCE_IP env var — the usual way to set this in a
# container, where the address depends on the host rather than on the image.
# A value that is not a valid IP address is logged as a warning and ignored
# (falls back to loopback-only) — it never stops the server from starting.
# local_source_ip = "192.168.88.10"

# ── OIDC (optional) ──────────────────────────────────────────────
# Uncomment to enable SSO. Works with Keycloak, Authentik, Authelia.
# Without this section, Ion Drift uses local auth only.

# [oidc]
# issuer_url = "https://your-idp.example.com/realms/YourRealm"
# client_id = "ion-drift"
# # IMPORTANT: redirect_uri must be the externally-accessible URL
# # (reverse proxy hostname), not the internal container IP.
# redirect_uri = "https://your-ion-drift.example.com/auth/callback"
# # Container path — same cert used by the router if same CA
# ca_cert_path = "/app/certs/root_ca.crt"
# # Role claim path (default: "realm_access.roles" for Keycloak)
# # Use "groups" for Authentik or Authelia
# # roles_claim = "realm_access.roles"
# # admin_role = "ion-drift-admin"

# ── mTLS Bootstrap (Keycloak only, optional) ─────────────────────
# Enables encrypted secrets at rest via KEK stored in Keycloak.
# Requires [oidc] and [tls] sections. Setup wizard fetches certs
# from CertWarden and bootstraps the KEK automatically.

# [oidc.bootstrap]
# client_id = "ion-drift-bootstrap"
# token_url = "https://your-keycloak.example.com/realms/YourRealm/protocol/openid-connect/token"
# admin_url = "https://your-keycloak.example.com/admin/realms/YourRealm"
# kek_attribute = "ion_drift_kek"

# [tls]
# client_cert = "/app/data/certs/client.crt"
# client_key = "/app/data/certs/client.key"

# [certwarden]
# base_url = "https://your-certwarden.example.com:4051/certwarden"
# cert_name = "your-cert-name"

[session]
cookie_name = "ion_drift_session"
max_age_seconds = 86400
# Keep true whenever browsers reach Ion Drift over HTTPS -- directly or via a
# TLS-terminating reverse proxy (Traefik, Nginx, Caddy). The Secure flag only
# governs the browser<->proxy leg; a plain-HTTP proxy->Ion Drift hop does not
# matter. Set false ONLY if browsers connect over plain HTTP (no TLS at all).
secure = true
same_site = "lax"
# Idle/inactivity timeout in seconds (0 disables; capped at max_age_seconds).
# Recommended for production: 43200 (12h).
idle_timeout_seconds = 43200

[syslog]
# The syslog listener is UNAUTHENTICATED (plaintext UDP, source-IP filter only,
# which is spoofable). Bind it to a trusted management segment/interface and do
# not expose it to untrusted networks. A spoofing attacker can both crowd out
# genuine firewall events and inject false connection records. If your router
# does not forward syslog, set bind_address = "127.0.0.1" to disable external
# ingest. See SECURITY.md.
port = 5514
bind_address = "0.0.0.0"
