[workspace]
resolver = "2"
members = [
    "crates/mikrotik-core",
    "crates/ion-drift-storage",
    "crates/ion-drift-module-api",
    "crates/ion-drift-module-host",
    "crates/ion-drift-cli",
    "crates/ion-drift-web",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "PolyForm-Shield-1.0.0"
# Source-available, not for crates.io. Also what makes cargo-deny's
# [licenses.private] exemption apply to the first-party crates.
publish = false
